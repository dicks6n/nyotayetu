<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Nyota Yetu">
  <defs>
    <clipPath id="c"><circle cx="32" cy="32" r="29"/></clipPath>
    <radialGradient id="sheen" cx="35%" cy="25%" r="75%">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>
  <!-- the flag, laid diagonally inside a coin -->
  <g clip-path="url(#c)" transform="rotate(-28 32 32)">
    <rect x="-10" y="-10" width="84" height="27" fill="#000"/>
    <rect x="-10" y="17" width="84" height="4" fill="#fff"/>
    <rect x="-10" y="21" width="84" height="22" fill="#BB0000"/>
    <rect x="-10" y="43" width="84" height="4" fill="#fff"/>
    <rect x="-10" y="47" width="84" height="27" fill="#006600"/>
  </g>
  <circle cx="32" cy="32" r="29" fill="url(#sheen)"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="#fff" stroke-width="2"/>
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width=".8"/>
  <!-- nyota: the star -->
  <path d="M32 17.5l4.1 9.1 9.9 1-7.4 6.7 2.1 9.8L32 39.1l-8.7 5 2.1-9.8-7.4-6.7 9.9-1z" fill="#fff" filter="url(#glow)" opacity=".7"/>
  <path d="M32 17.5l4.1 9.1 9.9 1-7.4 6.7 2.1 9.8L32 39.1l-8.7 5 2.1-9.8-7.4-6.7 9.9-1z" fill="#fff"/>
