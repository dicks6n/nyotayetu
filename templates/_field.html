<div class="field{% if field.field.widget.input_type == 'checkbox' %} check{% endif %}">
    {% if field.field.widget.input_type == 'checkbox' %}{{ field }}<label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {% else %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% endif %}
    {% for e in field.errors %}<div class="err">{{ e }}</div>{% endfor %}
</div>
